name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Workspace Modules
    runs-on: ubuntu-latest
    outputs:
      backend_present: ${{ steps.paths.outputs.backend_present }}
      frontend_present: ${{ steps.paths.outputs.frontend_present }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend and frontend presence
        id: paths
        run: |
          set -euo pipefail
          if [ -d backend ] && { [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; }; then
            echo "backend_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping backend-ci: backend/pyproject.toml or backend/requirements.txt not present."
          fi

          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "frontend_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping frontend-ci: frontend/package.json not present."
          fi

  ops-validate:
    name: Validate Compose, Docker & Env Config
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --no-cache-dir pyyaml

      - name: Validate YAML syntax and .env.example coverage
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import yaml

          # 1. YAML syntax checks
          for rel_path in ("compose.yaml", ".github/workflows/ci.yml"):
              path = pathlib.Path(rel_path)
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Expected YAML mapping in {rel_path}")
              print(f"YAML valid: {rel_path}")

          # 2. Verify only minimal baseline Compose services exist
          compose_data = yaml.safe_load(pathlib.Path("compose.yaml").read_text(encoding="utf-8"))
          services = set(compose_data.get("services", {}).keys())
          expected_services = {"db", "migrate", "api", "web"}
          if services != expected_services:
              raise SystemExit(f"Compose services mismatch: got {sorted(services)}, expected {sorted(expected_services)}")
          print(f"Compose baseline services verified: {sorted(services)}")

          # 3. Verify .env is not tracked in git
          tracked = subprocess.run(
              ["git", "ls-files", "--error-unmatch", ".env"],
              capture_output=True,
              text=True,
          )
          if tracked.returncode == 0:
              raise SystemExit("ERROR: .env file must never be tracked in Git")

          # 4. Verify .env.example required variables and placeholder safety
          required_vars = [
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
              "POSTGRES_DB",
              "DATABASE_URL",
              "ENVIRONMENT",
              "COOKIE_SECURE",
              "ALLOWED_ORIGINS",
              "CSRF_HMAC_SECRET",
              "GUEST_ORDER_HMAC_SECRET",
              "PAYMENT_WEBHOOK_SECRET",
              "PAYMENT_SANDBOX_MODE",
              "SESSION_TTL_HOURS",
              "RESERVATION_SWEEPER_INTERVAL_SECONDS",
              "FREE_SHIPPING_THRESHOLD_CENTS",
              "STANDARD_SHIPPING_CENTS",
              "TAX_RATE_BPS",
              "NEXT_PUBLIC_API_BASE_URL",
              "NEXT_PUBLIC_SITE_URL",
              "INTERNAL_API_BASE_URL",
          ]
          env_values = {}
          for raw_line in pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, val = line.split("=", 1)
              env_values[key.strip()] = val.strip()

          missing = [var for var in required_vars if not env_values.get(var)]
          if missing:
              raise SystemExit(f"Missing or empty variables in .env.example: {missing}")

          if "TRUSTED_PROXY_IPS" not in env_values:
              raise SystemExit("Missing optional key TRUSTED_PROXY_IPS in .env.example")

          for secret_var in ("POSTGRES_PASSWORD", "CSRF_HMAC_SECRET", "GUEST_ORDER_HMAC_SECRET", "PAYMENT_WEBHOOK_SECRET"):
              if not env_values[secret_var].startswith("CHANGE_ME_DEV_ONLY_"):
                  raise SystemExit(f"{secret_var} in .env.example must use a CHANGE_ME_DEV_ONLY_ placeholder")

          print(f".env.example coverage verified ({len(required_vars)} required variables + TRUSTED_PROXY_IPS present)")

          # 5. Verify hash-pinned backend lockfile exists
          if not pathlib.Path("backend/requirements.lock").is_file():
              raise SystemExit("ERROR: backend/requirements.lock must exist for hash-verified dependency installs")
          print("Verified backend/requirements.lock exists.")
          PY

      - name: Validate Compose configuration with .env.example
        run: |
          docker compose --env-file .env.example config --quiet
          echo "docker compose config passed."

      - name: Build backend Docker image (when backend exists)
        if: needs.detect.outputs.backend_present == 'true'
        run: docker build --file infra/docker/backend.Dockerfile ./backend

      - name: Build frontend Docker image (when frontend exists)
        if: needs.detect.outputs.frontend_present == 'true'
        run: |
          docker build \
            --file infra/docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            ./frontend

  backend-ci:
    name: Backend Lint, Typecheck, Migrations & Tests
    needs: detect
    if: needs.detect.outputs.backend_present == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_superuser_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ecom_test:ecom_test_password@localhost:5432/ecom_test
      TEST_DATABASE_URL: postgresql+psycopg://ecom_test:ecom_test_password@localhost:5432/ecom_test
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_PROXY_IPS: ""
      CSRF_HMAC_SECRET: ci_test_only_csrf_hmac_secret_min_32_characters_01
      GUEST_ORDER_HMAC_SECRET: ci_test_only_guest_order_hmac_secret_min_32_chars_02
      PAYMENT_WEBHOOK_SECRET: ci_test_only_payment_webhook_secret_min_32_chars_03
      PAYMENT_SANDBOX_MODE: "true"
      SESSION_TTL_HOURS: "168"
      RESERVATION_SWEEPER_INTERVAL_SECONDS: "60"
      FREE_SHIPPING_THRESHOLD_CENTS: "10000"
      STANDARD_SHIPPING_CENTS: "1000"
      TAX_RATE_BPS: "800"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and tooling
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            if [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
            fi
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          fi
          pip install ruff mypy pytest httpx pip-audit

      - name: Verify Python dependency consistency
        working-directory: backend
        run: python -m pip check

      - name: Audit pinned backend dependencies for known vulnerabilities
        working-directory: backend
        run: pip-audit -r requirements.lock --disable-pip

      - name: Provision least-privilege PostgreSQL test role and database
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:ci_pg_superuser_password@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "DO $$ BEGIN "
                      "IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ecom_test') THEN "
                      "CREATE ROLE ecom_test WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE "
                      "NOINHERIT NOREPLICATION PASSWORD 'ecom_test_password'; "
                      "END IF; END $$;"
                  )
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = 'ecom_test'")
                  if cur.fetchone() is None:
                      cur.execute("CREATE DATABASE ecom_test OWNER ecom_test ENCODING 'UTF8'")
          with psycopg.connect(
              "postgresql://postgres:ci_pg_superuser_password@localhost:5432/ecom_test",
              autocommit=True,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("GRANT ALL ON SCHEMA public TO ecom_test")
          print("Provisioned least-privilege role 'ecom_test' and database 'ecom_test'.")
          PY

      - name: Run Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Run Mypy typecheck
        working-directory: backend
        run: mypy app tests/run_disposable_pg_pytest.py tests/test_admin_and_analytics.py

      - name: Verify single linear Alembic migration head
        working-directory: backend
        run: |
          set -euo pipefail
          HEADS_OUTPUT="$(alembic heads)"
          echo "$HEADS_OUTPUT"
          HEAD_COUNT="$(printf '%s\n' "$HEADS_OUTPUT" | grep -cE '^[0-9a-fA-F]+' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head revision, found $HEAD_COUNT." >&2
            exit 1
          fi
          if ! printf '%s\n' "$HEADS_OUTPUT" | grep -qE '^0003_phase2_indexes_and_cleanup\b'; then
            echo "ERROR: Expected Alembic head 0003_phase2_indexes_and_cleanup, got: $HEADS_OUTPUT" >&2
            exit 1
          fi

      - name: Run Alembic migrations against PostgreSQL 16
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest suite (including live PostgreSQL 16 tests)
        working-directory: backend
        run: pytest -v

  frontend-ci:
    name: Frontend Lint, Typecheck, Build & Unit Tests
    needs: detect
    if: needs.detect.outputs.frontend_present == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify frontend production dependency tree
        working-directory: frontend
        run: npm ls --omit=dev --depth=0

      - name: Audit frontend dependencies for high/critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Next.js production build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest unit and component tests
        working-directory: frontend
        run: npm test

  e2e-ci:
    name: Full-Stack Playwright E2E (PostgreSQL 16)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_superuser_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ecom_test:ecom_test_password@localhost:5432/ecom_test
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_PROXY_IPS: ""
      PAYMENT_SANDBOX_MODE: "true"
      SESSION_TTL_HOURS: "168"
      RESERVATION_SWEEPER_INTERVAL_SECONDS: "60"
      FREE_SHIPPING_THRESHOLD_CENTS: "10000"
      STANDARD_SHIPPING_CENTS: "1000"
      TAX_RATE_BPS: "800"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      INTERNAL_API_BASE_URL: http://127.0.0.1:8000/api/v1
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ephemeral CI test secrets and demo credentials
        run: |
          python - <<'PY'
          import os
          import secrets

          env_pairs = {
              "CSRF_HMAC_SECRET": secrets.token_urlsafe(32),
              "GUEST_ORDER_HMAC_SECRET": secrets.token_urlsafe(32),
              "PAYMENT_WEBHOOK_SECRET": secrets.token_urlsafe(32),
              "DEMO_ADMIN_PASSWORD": f"E2eAdmin!{secrets.token_hex(8)}",
              "DEMO_STAFF_PASSWORD": f"E2eStaff!{secrets.token_hex(8)}",
              "DEMO_CUSTOMER_PASSWORD": f"E2eCust!{secrets.token_hex(8)}",
          }
          env_pairs["E2E_ADMIN_PASSWORD"] = env_pairs["DEMO_ADMIN_PASSWORD"]
          env_pairs["E2E_STAFF_PASSWORD"] = env_pairs["DEMO_STAFF_PASSWORD"]
          env_pairs["E2E_CUSTOMER_PASSWORD"] = env_pairs["DEMO_CUSTOMER_PASSWORD"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key, value in env_pairs.items():
                  print(f"::add-mask::{value}")
                  fh.write(f"{key}={value}\n")
          print("Generated masked ephemeral CI test secrets and demo passwords.")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Provision least-privilege PostgreSQL test role and database
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:ci_pg_superuser_password@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "DO $$ BEGIN "
                      "IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ecom_test') THEN "
                      "CREATE ROLE ecom_test WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE "
                      "NOINHERIT NOREPLICATION PASSWORD 'ecom_test_password'; "
                      "END IF; END $$;"
                  )
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = 'ecom_test'")
                  if cur.fetchone() is None:
                      cur.execute("CREATE DATABASE ecom_test OWNER ecom_test ENCODING 'UTF8'")
          with psycopg.connect(
              "postgresql://postgres:ci_pg_superuser_password@localhost:5432/ecom_test",
              autocommit=True,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("GRANT ALL ON SCHEMA public TO ecom_test")
          print("Provisioned least-privilege role 'ecom_test' and database 'ecom_test'.")
          PY

      - name: Run Alembic migrations against PostgreSQL 16
        working-directory: backend
        run: alembic upgrade head

      - name: Seed demo catalog and demo users
        working-directory: backend
        run: python -m app.cli seed-demo --with-demo-users

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Next.js standalone bundle
        working-directory: frontend
        run: npm run build

      - name: Start FastAPI backend server
        working-directory: backend
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 </dev/null >/tmp/e2e_uvicorn.log 2>&1 &
          echo "$!" > /tmp/e2e_uvicorn.pid

      - name: Wait for FastAPI health endpoint
        run: |
          set -euo pipefail
          pid="$(cat /tmp/e2e_uvicorn.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "ERROR: uvicorn exited prematurely." >&2
              tail -n 60 /tmp/e2e_uvicorn.log || true
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'; then
              echo "FastAPI health check passed on attempt $attempt."
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Timed out waiting for FastAPI health endpoint." >&2
          tail -n 60 /tmp/e2e_uvicorn.log || true
          exit 1

      - name: Start Next.js standalone server
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -a .next/static/. .next/standalone/.next/static/
          if [ -d public ] && [ -n "$(ls -A public)" ]; then
            cp -a public/. .next/standalone/public/
          fi
          HOSTNAME=127.0.0.1 \
          PORT=3000 \
          NODE_ENV=production \
          INTERNAL_API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            nohup node .next/standalone/server.js </dev/null >/tmp/e2e_nextjs.log 2>&1 &
          echo "$!" > /tmp/e2e_nextjs.pid

      - name: Wait for Next.js frontend readiness
        run: |
          set -euo pipefail
          pid="$(cat /tmp/e2e_nextjs.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "ERROR: Next.js standalone server exited prematurely." >&2
              tail -n 60 /tmp/e2e_nextjs.log || true
              exit 1
            fi
            if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:3000/; then
              echo "Next.js readiness check passed on attempt $attempt."
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Timed out waiting for Next.js frontend readiness." >&2
          tail -n 60 /tmp/e2e_nextjs.log || true
          exit 1

      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright failure traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            /tmp/e2e_uvicorn.log
            /tmp/e2e_nextjs.log
          retention-days: 7

      - name: Stop E2E background servers
        if: always()
        run: |
          for pid_file in /tmp/e2e_nextjs.pid /tmp/e2e_uvicorn.pid; do
            if [ -f "$pid_file" ]; then
              pid="$(cat "$pid_file" || true)"
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                for _ in $(seq 1 10); do
                  if ! kill -0 "$pid" 2>/dev/null; then
                    break
                  fi
                  sleep 0.5
                done
                if kill -0 "$pid" 2>/dev/null; then
                  kill -9 "$pid" 2>/dev/null || true
                fi
              fi
            fi
          done
